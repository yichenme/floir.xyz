<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>floir collision editor</title>
<style>
  html,body{margin:0;height:100%;background:#1e1e1e;color:#ddd;font:13px system-ui,sans-serif;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;height:44px;background:#2a2a2a;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:10;border-bottom:1px solid #444;flex-wrap:wrap}
  #bar button,#bar label{background:#3a3a3a;border:1px solid #555;color:#ddd;padding:5px 9px;border-radius:4px;cursor:pointer;user-select:none}
  #bar button.on{background:#2d6cdf;border-color:#2d6cdf}
  #bar .sep{width:1px;height:24px;background:#555;margin:0 4px}
  #hint{color:#999;margin-left:auto;font-size:12px}
  canvas{position:absolute;top:44px;left:0;cursor:crosshair;touch-action:none}
  #io{position:fixed;right:0;top:44px;bottom:0;width:340px;background:#252525;border-left:1px solid #444;display:none;flex-direction:column;z-index:9}
  #io textarea{flex:1;background:#111;color:#9f9;border:0;padding:8px;font:11px monospace;resize:none}
  #io .row{display:flex;gap:6px;padding:8px}
  #io button{flex:1;background:#3a3a3a;border:1px solid #555;color:#ddd;padding:8px;border-radius:4px;cursor:pointer}
  #coord{position:fixed;bottom:8px;left:8px;background:#000a;padding:4px 8px;border-radius:4px;z-index:8}
</style></head><body>
<div id="bar">
  <button id="mCell" class="on">Toggle cell</button>
  <button id="mBox">Draw box</button>
  <button id="mErase">Erase box</button>
  <span class="sep"></span>
  <label><input type="checkbox" id="showMap" checked> Map</label>
  <label><input type="checkbox" id="showGrid" checked> Grid</label>
  <label><input type="checkbox" id="showColl" checked> Collision</label>
  <span class="sep"></span>
  <button id="clearCells">Clear cells</button>
  <button id="clearBoxes">Clear boxes</button>
  <button id="ioBtn">Import / Export JSON</button>
  <span id="hint">wheel=zoom &middot; drag middle/right or Space+drag=pan</span>
</div>
<canvas id="cv"></canvas>
<div id="io">
  <div class="row"><button id="doExport">Export &rarr; box</button><button id="doImport">Import from box</button><button id="doDownload">Download .json</button></div>
  <textarea id="ta" spellcheck="false"></textarea>
</div>
<div id="coord">cell -,-</div>

  if(mode==='cell'){const c=Math.floor(wx/CELL),r=Math.floor(wy/CELL);if(c<0||r<0||c>=GW||r>=GH)return;const k=r*GW+c;blocked.has(k)?blocked.delete(k):blocked.add(k);draw();}
  else if(mode==='box'){dragStart=[wx,wy];dragBox={x:wx,y:wy,w:0,h:0};}
  else if(mode==='erase'){for(let i=boxes.length-1;i>=0;i--){const b=boxes[i];if(wx>=b.x&&wx<=b.x+b.w&&wy>=b.y&&wy<=b.y+b.h){boxes.splice(i,1);break;}}draw();}
});
addEventListener('mousemove',e=>{
  const sx=e.clientX, sy=e.clientY-44;const [wx,wy]=S2W(sx,sy);
  document.getElementById('coord').textContent='cell '+Math.floor(wx/CELL)+','+Math.floor(wy/CELL)+'   world '+Math.round(wx)+','+Math.round(wy);
  if(pan){view.x=pan.vx+(sx-pan.sx);view.y=pan.vy+(sy-pan.sy);draw();return;}
  if(dragBox&&dragStart){dragBox={x:Math.min(dragStart[0],wx),y:Math.min(dragStart[1],wy),w:Math.abs(wx-dragStart[0]),h:Math.abs(wy-dragStart[1])};draw();}
});
addEventListener('mouseup',e=>{
  if(pan){pan=null;return;}
  if(dragBox&&dragStart){if(dragBox.w>20&&dragBox.h>20)boxes.push({x:Math.round(dragBox.x),y:Math.round(dragBox.y),w:Math.round(dragBox.w),h:Math.round(dragBox.h)});dragBox=null;dragStart=null;draw();}
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
// buttons
function setMode(m){mode=m;['cell','box','erase'].forEach(x=>document.getElementById('m'+x[0].toUpperCase()+x.slice(1)).classList.toggle('on',x===m));}
document.getElementById('mCell').onclick=()=>setMode('cell');
document.getElementById('mBox').onclick=()=>setMode('box');
document.getElementById('mErase').onclick=()=>setMode('erase');
['showMap','showGrid','showColl'].forEach(id=>document.getElementById(id).onchange=draw);
document.getElementById('clearCells').onclick=()=>{if(confirm('Clear ALL blocked cells?')){blocked.clear();draw();}};
document.getElementById('clearBoxes').onclick=()=>{boxes=[];draw();};
const io=document.getElementById('io');
document.getElementById('ioBtn').onclick=()=>{io.style.display=io.style.display==='flex'?'none':'flex';};
function exportJSON(){const cells=[...blocked].map(k=>[k%GW,(k/GW)|0]).sort((a,b)=>a[1]-b[1]||a[0]-b[0]);return JSON.stringify({gridW:GW,gridH:GH,cellSize:CELL,blockedCells:cells,boxes},null,1);}
document.getElementById('doExport').onclick=()=>{document.getElementById('ta').value=exportJSON();};
document.getElementById('doImport').onclick=()=>{try{const j=JSON.parse(document.getElementById('ta').value);blocked=new Set((j.blockedCells||[]).map(([c,r])=>r*GW+c));boxes=j.boxes||[];draw();}catch(e){alert('bad JSON: '+e.message)}};
document.getElementById('doDownload').onclick=()=>{const b=new Blob([exportJSON()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='floir-collision.json';a.click();};
resize();
</script></body></html>
