<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>floir collision editor</title>
<style>
  html,body{margin:0;height:100%;background:#1e1e1e;color:#ddd;font:13px system-ui,sans-serif;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;min-height:44px;background:#2a2a2a;display:flex;align-items:center;gap:8px;padding:6px 10px;z-index:10;border-bottom:1px solid #444;flex-wrap:wrap}
  #bar button,#bar label{background:#3a3a3a;border:1px solid #555;color:#ddd;padding:5px 9px;border-radius:4px;cursor:pointer;user-select:none}
  #bar button.on{background:#2d6cdf;border-color:#2d6cdf}
  #bar .sep{width:1px;height:24px;background:#555;margin:0 4px}
  #hint{color:#999;font-size:12px}
  canvas{position:absolute;left:0;cursor:crosshair;touch-action:none}
  #io{position:fixed;right:0;top:56px;bottom:0;width:360px;background:#252525;border-left:1px solid #444;display:none;flex-direction:column;z-index:9}
  #io textarea{flex:1;background:#111;color:#9f9;border:0;padding:8px;font:11px monospace;resize:none}
  #io .row{display:flex;gap:6px;padding:8px}
  #io button{flex:1;background:#3a3a3a;border:1px solid #555;color:#ddd;padding:8px;border-radius:4px;cursor:pointer}
  #coord{position:fixed;bottom:8px;left:8px;background:#000a;padding:4px 8px;border-radius:4px;z-index:8}
  input[type=range]{vertical-align:middle}
</style></head><body>
<div id="bar">
  <button id="mPaint" class="on">Paint +</button>
  <button id="mErase">Erase &minus;</button>
  <button id="mBoxA">Box fill</button>
  <button id="mBoxD">Box clear</button>
  <span class="sep"></span>
  <label>Brush <input type="range" id="brush" min="1" max="20" value="3"><span id="bval">3</span></label>
  <span class="sep"></span>
  <label><input type="checkbox" id="showMap" checked> Map</label>
  <label><input type="checkbox" id="showGrid" checked> Cell grid</label>
  <label><input type="checkbox" id="showColl" checked> Collision</label>
  <span class="sep"></span>
  <button id="reset">Reset to current</button>
  <button id="clearAll">Clear all</button>
  <button id="ioBtn">Import / Export</button>
  <span id="hint">wheel=zoom &middot; middle/right/Space+drag=pan &middot; 1 unit = 25 world u</span>
</div>
<canvas id="cv"></canvas>
<div id="io">
  <div class="row"><button id="doExport">Export</button><button id="doImport">Import</button><button id="doDownload">Download .json</button></div>
  <textarea id="ta" spellcheck="false" placeholder="Export writes JSON here; paste JSON and Import to load."></textarea>
</div>
<div id="coord">-</div>

    for(let c=0;c<=GW;c++){const[sx]=W2S(c*CELL,0);ctx.moveTo(sx,oy);ctx.lineTo(sx,oy+h)}
    for(let r=0;r<=GH;r++){const[,sy]=W2S(0,r*CELL);ctx.moveTo(ox,sy);ctx.lineTo(ox+w,sy)}ctx.stroke();}
  if(boxPrev){const[sx,sy]=W2S(boxPrev.x*UNIT,boxPrev.y*UNIT);ctx.strokeStyle="#2d6cdf";ctx.lineWidth=1.5;ctx.strokeRect(sx,sy,boxPrev.w*UNIT*view.s,boxPrev.h*UNIT*view.s)}
}
// interaction
let pan=null,painting=false,space=false,boxStart=null,boxPrev=null;
addEventListener('keydown',e=>{if(e.code==='Space')space=true});
addEventListener('keyup',e=>{if(e.code==='Space')space=false});
cv.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:1/1.12;const top=cv.offsetTop;const[wx,wy]=S2W(e.clientX,e.clientY-top);view.s*=f;view.x=e.clientX-wx*view.s;view.y=(e.clientY-top)-wy*view.s;draw()},{passive:false});
function evU(e){const top=cv.offsetTop;const[wx,wy]=S2W(e.clientX,e.clientY-top);return[Math.floor(wx/UNIT),Math.floor(wy/UNIT),wx,wy]}
function paintAt(ux,uy,v){const b=+document.getElementById('brush').value;const r=b-1;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){set(ux+dx,uy+dy,v);pokeImg(ux+dx,uy+dy)}cctx.putImageData(cimg,0,0);}
let mode='paint';
cv.addEventListener('mousedown',e=>{
  const top=cv.offsetTop;
  if(e.button===1||e.button===2||space){pan={sx:e.clientX,sy:e.clientY-top,vx:view.x,vy:view.y};return;}
  const[ux,uy]=evU(e);
  if(mode==='paint'||mode==='erase'){painting=true;paintAt(ux,uy,mode==='paint'?1:0);draw();}
  else if(mode==='boxA'||mode==='boxD'){boxStart=[ux,uy];boxPrev={x:ux,y:uy,w:1,h:1};}
});
addEventListener('mousemove',e=>{
  const top=cv.offsetTop;const[ux,uy,wx,wy]=evU(e);
  document.getElementById('coord').textContent='unit '+ux+','+uy+'   cell '+Math.floor(wx/CELL)+','+Math.floor(wy/CELL)+'   world '+Math.round(wx)+','+Math.round(wy);
  if(pan){view.x=pan.vx+(e.clientX-pan.sx);view.y=pan.vy+((e.clientY-top)-pan.sy);draw();return;}
  if(painting){paintAt(ux,uy,mode==='paint'?1:0);draw();}
  else if(boxStart){boxPrev={x:Math.min(boxStart[0],ux),y:Math.min(boxStart[1],uy),w:Math.abs(ux-boxStart[0])+1,h:Math.abs(uy-boxStart[1])+1};draw();}
});
addEventListener('mouseup',e=>{
  if(pan){pan=null;return;}painting=false;
  if(boxStart&&boxPrev){const v=mode==='boxA'?1:0;for(let y=boxPrev.y;y<boxPrev.y+boxPrev.h;y++)for(let x=boxPrev.x;x<boxPrev.x+boxPrev.w;x++){set(x,y,v);pokeImg(x,y)}cctx.putImageData(cimg,0,0);boxStart=null;boxPrev=null;draw();}
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function setMode(m,id){mode=m;['mPaint','mErase','mBoxA','mBoxD'].forEach(x=>document.getElementById(x).classList.toggle('on',x===id));}
document.getElementById('mPaint').onclick=()=>setMode('paint','mPaint');
document.getElementById('mErase').onclick=()=>setMode('erase','mErase');
document.getElementById('mBoxA').onclick=()=>setMode('boxA','mBoxA');
document.getElementById('mBoxD').onclick=()=>setMode('boxD','mBoxD');
document.getElementById('brush').oninput=e=>document.getElementById('bval').textContent=e.target.value;
['showMap','showGrid','showColl'].forEach(id=>document.getElementById(id).onchange=draw);
document.getElementById('reset').onclick=()=>{if(confirm('Reset to the current live collision?')){bits=b64ToBits(B64_INIT);rebuildImg();draw();}};
document.getElementById('clearAll').onclick=()=>{if(confirm('Clear ALL collision?')){bits=new Uint8Array(bits.length);rebuildImg();draw();}};
const io=document.getElementById('io');document.getElementById('ioBtn').onclick=()=>{io.style.display=io.style.display==='flex'?'none':'flex'};
function expJSON(){let n=0;for(let i=0;i<UW*UH;i++)n+=(bits[i>>3]>>(i&7))&1;return JSON.stringify({unit:UNIT,gridW:UW,gridH:UH,worldW:MAPW,worldH:MAPH,blockedUnits:n,bitsB64:bitsToB64(bits)});}
document.getElementById('doExport').onclick=()=>{document.getElementById('ta').value=expJSON()};
document.getElementById('doImport').onclick=()=>{try{const j=JSON.parse(document.getElementById('ta').value);if(j.gridW!==UW||j.gridH!==UH)throw new Error('grid mismatch');bits=b64ToBits(j.bitsB64);rebuildImg();draw();}catch(e){alert('bad JSON: '+e.message)}};
document.getElementById('doDownload').onclick=()=>{const b=new Blob([expJSON()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='floir-collision.json';a.click()};
resize();
</script></body></html>
