<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>floir.xyz admin</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Ubuntu, system-ui, sans-serif; background: #2b2b2b; color: #eee; }
        .wrap { max-width: 620px; margin: 40px auto; padding: 0 16px; }
        h1 { font-size: 22px; }
        .card { background: #3a3a3a; border-radius: 8px; padding: 18px; margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: #bbb; margin: 8px 0 4px; }
        input, select { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #555; background: #2b2b2b; color: #eee; font-size: 14px; }
        button { margin-top: 12px; padding: 9px 16px; border: 0; border-radius: 5px; background: #5a9fdb; color: #fff; font-weight: 700; cursor: pointer; font-size: 14px; }
        button:hover { background: #4a8fcb; }
        .row { display: flex; gap: 10px; }
        .row > * { flex: 1; }
        .hidden { display: none; }
        .msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
        .ok { color: #6ee06e; } .err { color: #e06e6e; }
        #users { list-style: none; padding: 0; margin: 10px 0 0; max-height: 220px; overflow-y: auto; }
        #users li { padding: 7px 10px; border-radius: 5px; cursor: pointer; }
        #users li:hover { background: #4a4a4a; }
        #users li.sel { background: #5a9fdb; color: #fff; }
        .target { font-size: 13px; color: #bbb; margin-top: 6px; }
        .target b { color: #6ee0e0; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>floir.xyz — admin</h1>

    <div class="card" id="loginCard">
        <label>Admin username</label>
        <input id="au" autocomplete="off" value="admin">
        <label>Admin password</label>
        <input id="ap" type="password" autocomplete="off">
        <button onclick="login()">Log in</button>
        <div class="msg err" id="loginMsg"></div>
    </div>

    <div class="card hidden" id="searchCard">
        <label>Search registered players</label>
        <div class="row">
            <input id="q" placeholder="username (partial ok)" oninput="search()">
        </div>
        <ul id="users"></ul>
    </div>

    <div class="card hidden" id="giveCard">
        <div class="target">Give to: <b id="targetName">(pick a player above)</b></div>
        <label>Petal</label>
        <select id="petal"></select>
        <div class="row">
            <div>
                <label>Rarity</label>
                <select id="rarity"></select>
            </div>
            <div>
                <label>Count</label>
                <input id="count" type="number" value="1" min="1">
            </div>
        </div>
        <button onclick="give()">Give petal</button>
        <div class="msg" id="giveMsg"></div>
    </div>

    <div class="card hidden" id="spawnCard">
        <label>Spawn mob (right-click the map)</label>
        <canvas id="mapCanvas" width="600" height="612" style="width:100%;max-width:600px;height:auto;border-radius:5px;cursor:crosshair;"></canvas>
        <div class="target" style="margin-top:4px;"><span style="color:#ffe066;">●</span> player &nbsp; <span style="color:#ff6e6e;">●</span> mob</div>
        <div class="row" style="margin-top:10px;">
            <div>
                <label>Mob</label>
                <select id="mob"></select>
            </div>
            <div>
                <label>Rarity</label>
                <select id="spawnRarity"></select>
            </div>
        </div>
        <div class="target">Last click: <b id="spawnPos">(none yet)</b></div>
        <div class="msg" id="spawnMsg"></div>
    </div>
</div>
<script>
    var PETALS = ["None","Basic","Light","Heavy(old)","Stinger","Leaf","Twin(retired)","Rose","Iris","Missile","Dandelion","Bubble","Faster","Rock","Cactus","Web","Wing","Peas","Sand","Pincer","Dahlia","Triplet(retired)","Ant Egg","Blue Iris(retired)","Pollen","Grapes","Beetle Egg","Azalea(retired)","Stick","Tringer","Triweb(retired)","Antennae","Tricactus(retired)","Heavy","Third Eye","Observer","Purple Cactus(retired)","Salt","Unique Basic","Square","Moon","Lotus","Cutter","Yin Yang","Yggdrasil","Rice","Bone","Yucca","Corn","Golden Leaf"];
    var RARITIES = ["Common","Uncommon","Rare","Epic","Legendary","Mythic","Ultra","Super","Unique"];
    // Mirrors MobID's order in Shared/StaticDefinitions.hh. Two entries share
    // the in-game display name "Ladybug" (Dark/Shiny variants) -- disambiguated
    // here for the dropdown only, not a gameplay name change.
    var MOBS = ["Baby Ant","Worker Ant","Soldier Ant","Bee","Ladybug","Beetle","Ladybug (Dark)","Hornet","Cactus","Rock","Centipede","Evil Centipede","Desert Centipede","Sandstorm","Scorpion","Spider","Ant Hole","Queen Ant","Ladybug (Shiny)","Square","Digger"];
    var creds = null, target = null;
    var zones = [];

    // Retired/removed petal IDs (kept numbered for account compatibility, but
    // never giveable). Mirrors RETIRED_PETALS in Server/Account/database.js.
    // Index 0 (None) is also hidden. kTringer (29) folded into Stinger.
    var RETIRED = new Set([0,3,6,21,23,27,29,30,32,36]);
    function fillSelect(el, arr){ el.innerHTML = arr.map(function(n,i){ return '<option value="'+i+'">'+n+' ('+i+')</option>'; }).join(''); }
    function fillPetalSelect(el, arr){ el.innerHTML = arr.map(function(n,i){ return RETIRED.has(i) ? '' : '<option value="'+i+'">'+n+' ('+i+')</option>'; }).join(''); }
    fillPetalSelect(document.getElementById('petal'), PETALS);
    fillSelect(document.getElementById('rarity'), RARITIES);
    fillSelect(document.getElementById('mob'), MOBS);
    fillSelect(document.getElementById('spawnRarity'), RARITIES);

    async function api(payload){
        const body = Object.assign({ user: creds.user, password: creds.pass }, payload);
        const r = await fetch('/admin/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        return r.json();
    }

    async function login(){
        creds = { user: document.getElementById('au').value.trim(), pass: document.getElementById('ap').value };
        const res = await api({ action: 'search', query: '' });
        const m = document.getElementById('loginMsg');
        if (res.ok){
            m.textContent = '';
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('searchCard').classList.remove('hidden');
            document.getElementById('giveCard').classList.remove('hidden');
            document.getElementById('spawnCard').classList.remove('hidden');
            renderUsers(res.users);
            loadZones();
            startLivePolling();
        } else {
            m.textContent = res.error || 'login failed';
        }
    }

    // --- Spawn minimap: the SAME walkable/blocked bitmap the in-game minimap
    // draws from (Client/Ui/InGame/Map.cc samples Tilemap::solid_at() into a
    // black/white silhouette -- /map-overview.png is that identical bitmap,
    // rendered once by Scripts/gen_map.py from the same source data, so this
    // is a pixel-accurate match rather than an approximation). Zone bounds
    // (still fetched from /admin/zones.json) are only used for the world size
    // and the right-click -> world-coordinate conversion, not drawn.
    var ARENA_W = 25000, ARENA_H = 25500;
    var mapImg = new Image();
    async function loadZones(){
        try {
            const r = await fetch('/admin/zones.json');
            zones = await r.json();
            if (zones.length) {
                ARENA_W = Math.max.apply(null, zones.map(function(z){ return z.right; }));
                ARENA_H = Math.max.apply(null, zones.map(function(z){ return z.bottom; }));
            }
        } catch (e) { zones = []; }
        mapImg.onload = drawMap;
        mapImg.src = '/map-overview.png';   // ETag/no-cache revalidation is server-side (Wasm.cc)
    }

    // Live overlay: polled from the running simulation (action:'live') so
    // spawned mobs and moving players show up on top of the static terrain
    // bitmap without a page reload. liveData is redrawn every poll tick and
    // also immediately after a successful spawn, so the new mob appears at
    // once instead of waiting for the next poll.
    var liveData = { players: [], mobs: [] };
    var liveTimer = null;

    function drawMap(){
        const cv = document.getElementById('mapCanvas');
        const ctx = cv.getContext('2d');
        ctx.clearRect(0, 0, cv.width, cv.height);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(mapImg, 0, 0, cv.width, cv.height);
        drawLive(ctx, cv);
    }

    function drawLive(ctx, cv){
        const sx = cv.width / ARENA_W, sy = cv.height / ARENA_H;
        ctx.save();
        ctx.fillStyle = '#ff6e6e';
        liveData.mobs.forEach(function(m){
            ctx.beginPath();
            ctx.arc(m.x * sx, m.y * sy, 3, 0, 2 * Math.PI);
            ctx.fill();
        });
        ctx.fillStyle = '#ffe066';
        ctx.strokeStyle = '#00000080';
        ctx.lineWidth = 1;
        liveData.players.forEach(function(p){
            ctx.beginPath();
            ctx.arc(p.x * sx, p.y * sy, 5, 0, 2 * Math.PI);
            ctx.fill();
            ctx.stroke();
        });
        ctx.restore();
    }

    async function pollLive(){
        try {
            const res = await api({ action: 'live' });
            if (res.ok && res.live) {
                liveData = res.live;
                if (mapImg.complete) drawMap();
            }
        } catch (e) { /* transient -- next tick retries */ }
    }

    function startLivePolling(){
        if (liveTimer) return;
        pollLive();
        liveTimer = setInterval(pollLive, 700);
    }

    document.getElementById('mapCanvas').addEventListener('contextmenu', async function(e){
        e.preventDefault();
        const cv = e.target;
        const rect = cv.getBoundingClientRect();
        // Canvas is CSS-scaled (width:100%), so map the click through the
        // rendered box size, not the canvas's internal pixel size.
        const cx = (e.clientX - rect.left) / rect.width * ARENA_W;
        const cy = (e.clientY - rect.top) / rect.height * ARENA_H;
        document.getElementById('spawnPos').textContent = Math.round(cx) + ', ' + Math.round(cy);
        const m = document.getElementById('spawnMsg');
        const res = await api({
            action: 'spawn', x: cx, y: cy,
            mobId: parseInt(document.getElementById('mob').value, 10),
            rarity: parseInt(document.getElementById('spawnRarity').value, 10)
        });
        m.className = 'msg ' + (res.ok ? 'ok' : 'err');
        m.textContent = res.ok ? 'spawned' : (res.error || 'failed');
        if (res.ok) pollLive();   // don't wait for the next 700ms tick
    });

    var searchTimer = null;
    function search(){
        clearTimeout(searchTimer);
        searchTimer = setTimeout(async function(){
            const res = await api({ action: 'search', query: document.getElementById('q').value.trim() });
            if (res.ok) renderUsers(res.users);
        }, 200);
    }

    function renderUsers(users){
        const ul = document.getElementById('users');
        ul.innerHTML = '';
        users.forEach(function(u){
            const li = document.createElement('li');
            li.textContent = u;
            li.onclick = function(){
                target = u;
                document.getElementById('targetName').textContent = u;
                Array.prototype.forEach.call(ul.children, function(c){ c.classList.remove('sel'); });
                li.classList.add('sel');
            };
            ul.appendChild(li);
        });
        if (!users.length) ul.innerHTML = '<li style="cursor:default;color:#888">no matches</li>';
    }

    async function give(){
        const m = document.getElementById('giveMsg');
        if (!target){ m.className = 'msg err'; m.textContent = 'pick a player first'; return; }
        const res = await api({
            action: 'give', target: target,
            type: parseInt(document.getElementById('petal').value, 10),
            rarity: parseInt(document.getElementById('rarity').value, 10),
            count: parseInt(document.getElementById('count').value, 10) || 1
        });
        m.className = 'msg ' + (res.ok ? 'ok' : 'err');
        m.textContent = res.ok ? (res.message || 'done') : (res.error || 'failed');
    }
</script>
</body>
</html>
