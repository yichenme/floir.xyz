<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
        <link rel="icon" type="image/webp" href="floir.webp">
        <link href="https://fonts.googleapis.com/css?family=Ubuntu:700" rel="stylesheet" type="text/css">
        <style>
            * {
                margin: 0px;
                padding: 0px;
                overflow: hidden;
            }
            #canvas {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                height: 100%;
                cursor: default;
            }
            #loading-bar {
                position: absolute;
                top: 0%;
                left: 0%;
                width: 100%;
                height: 100%;
                background-color: #000000;
            }
            #loading {
                position: absolute;
                top: 50%;
                left: 50%;
                font-size: 48pt;
                font-family: sans-serif;
                transform: translate(-50%, -50%);
                color: #ffffff;
                font-weight: bold;
            }
        </style>
        <meta name="viewport" content="user-scalable=no, width=device-width, height=device-height, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    </head>
    <body>
    <div id="loading-bar">
        <span id="loading">Loading</span>
    </div>
    <div id="font-loader" style="font-family: Ubuntu;">hello!</div>
    <canvas id="canvas" width="0" height="0"></canvas>
    <script>
        // Cache-busting: __CLIENT_VER__ is replaced at deploy time with the
        // client wasm's content hash, so every deploy forces browsers to fetch
        // a matching js + wasm pair. Loading a new floir-client.js against an
        // old cached floir-client.wasm reads garbage memory (wrong offsets),
        // which shows up as corrupted values in-game (e.g. wrong petal rarities).
        var CLIENT_VER = '__CLIENT_VER__';
        var Module = {
            locateFile: function(path, prefix){ return (prefix || '') + path + '?v=' + CLIENT_VER; }
        };
        document.addEventListener("DOMContentLoaded", () => {
            const script = document.createElement('script');
            script.src = 'floir-client.js?v=' + CLIENT_VER;
            script.async = true;
            document.body.appendChild(script);
        });
    </script>
    </body>
</html>
