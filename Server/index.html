<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
        <link rel="icon" type="image/webp" href="floir.webp">
        <link href="https://fonts.googleapis.com/css?family=Ubuntu:700" rel="stylesheet" type="text/css">
        <style>
            * {
                margin: 0px;
                padding: 0px;
                overflow: hidden;
            }
            html, body {
                /* Kill mobile/iPad pinch-zoom, scroll-bounce and long-press select. */
                touch-action: none;
                overscroll-behavior: none;
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
            }
            input, textarea {
                -webkit-user-select: text;
                user-select: text;
            }
            #canvas {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                width: 100%;
                height: 100%;
                cursor: default;
                touch-action: none;
            }
            #loading-bar {
                position: absolute;
                top: 0%;
                left: 0%;
                width: 100%;
                height: 100%;
                background-color: #000000;
            }
            #loading {
                position: absolute;
                top: 50%;
                left: 50%;
                font-size: 48pt;
                font-family: sans-serif;
                transform: translate(-50%, -50%);
                color: #ffffff;
                font-weight: bold;
            }
        </style>
        <meta name="viewport" content="user-scalable=no, width=device-width, height=device-height, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    </head>
    <body>
    <div id="loading-bar">
        <span id="loading">Loading</span>
    </div>
    <div id="font-loader" style="font-family: Ubuntu;">hello!</div>
    <canvas id="canvas" width="0" height="0"></canvas>
    <script>
        // Block iOS/iPad pinch-zoom, double-tap-zoom and scroll gestures that
        // otherwise fire while playing.
        ["gesturestart", "gesturechange", "gestureend"].forEach((ev) =>
            document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
        document.addEventListener("touchmove", (e) => {
            if (e.touches.length > 1 || e.scale !== 1) e.preventDefault();
        }, { passive: false });
        let _lastTouch = 0;
        document.addEventListener("touchend", (e) => {
            const now = Date.now();
            if (now - _lastTouch <= 300) e.preventDefault();   // double-tap zoom
            _lastTouch = now;
        }, { passive: false });
        document.addEventListener("DOMContentLoaded", () => {
            const script = document.createElement('script');
            script.src = 'floir-client.js';
            script.async = true;
            document.body.appendChild(script);
        });
    </script>
    </body>
</html>
